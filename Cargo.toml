[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
fr_math = { version = "0.1.0", path = "crates/fr_math" }
fr_handle = { version = "0.1.0", path = "crates/fr_handle" }
fr_time = { version = "0.1.0", path = "crates/fr_time" }
fr_color = { version = "0.1.0", path = "crates/fr_color" }
fr_transform = { version = "0.1.0", path = "crates/fr_transform" }
fr_input = { version = "0.1.0", path = "crates/fr_input" }
fr_image = { version = "0.1.0", path = "crates/fr_image" }
fr_mesh = { version = "0.1.0", path = "crates/fr_mesh" }
fr_material = { version = "0.1.0", path = "crates/fr_material" }
fr_light = { version = "0.1.0", path = "crates/fr_light" }
fr_camera = { version = "0.1.0", path = "crates/fr_camera" }
fr_assets = { version = "0.1.0", path = "crates/fr_assets" }
fr_physics = { version = "0.1.0", path = "crates/fr_physics" }
fr_window = { version = "0.1.0", path = "crates/fr_window" }
fr_render = { version = "0.1.0", path = "crates/fr_render" }
fr_ui = { version = "0.1.0", path = "crates/fr_ui" }
fr_engine = { version = "0.1.0", path = "crates/fr_engine" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
